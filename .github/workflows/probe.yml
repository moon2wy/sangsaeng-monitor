name: probe-access
# 해외(GitHub) 서버에서 상생누리 접속 가능 여부 확인 (시험용, 요청 3회)
on:
  push:
    paths: ['.github/workflows/probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: runner location
        run: curl -sS --max-time 10 https://ipinfo.io/json | grep -E '"(country|region|org)"' || true
      - name: robots.txt with app UA
        run: |
          curl -sS --max-time 30 -A 'SangsaengPersonalMonitor/2.0' -o a.html -w 'HTTP %{http_code}\n' https://www.winwinnuri.or.kr/robots.txt || true
          sed -e 's/<[^>]*>//g' a.html | tr -s ' \t\n' ' ' | tail -c 600; echo
      - name: robots.txt with browser UA
        run: |
          sleep 3
          curl -sS --max-time 30 -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36' \
            -H 'Accept-Language: ko-KR,ko;q=0.9' -o b.html -w 'HTTP %{http_code}\n' https://www.winwinnuri.or.kr/robots.txt || true
          sed -e 's/<[^>]*>//g' b.html | tr -s ' \t\n' ' ' | tail -c 600; echo
      - name: main page headers
        run: |
          sleep 3
          curl -sS --max-time 30 -I https://www.winwinnuri.or.kr/ || true
